# SkillSwap (Python full stack): one command runs everything.
#   cp .env.example .env   (add your free Groq key)
#   docker compose up --build
# Frontend http://localhost:3000 | API http://localhost:8000 | API docs http://localhost:8000/docs

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/db/skillswap.db
      JWT_SECRET: ${JWT_SECRET:-skillswap-docker-secret-change-me-0123456789abcdef}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-openai/gpt-oss-20b}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@skillswap.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      APP_TIMEZONE: Asia/Kolkata
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - sqlite-data:/app/data/db        # the SQLite file survives container restarts
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sqlite-data:
